name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # main and the tag object are needed to verify ancestry and signature.
          fetch-depth: 0
      - name: Verify tag signature and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Refetch the tag so it stays annotated whatever checkout did with it.
          git fetch --force --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          scripts/verify-release-tag.sh "$RELEASE_TAG" origin/main
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release-notes.py "$RELEASE_TAG"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for maintainer approval; the environment only accepts v* tags.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release-notes.py "$RELEASE_TAG" --output release-notes.md
      - name: Verify archives and collect checksums
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl.tar.gz x86_64-pc-windows-msvc.zip; do
            asset="iroh-toolbox-$RELEASE_TAG-$target"
            test -f "$asset"
            sha256sum --check "$asset.sha256"
          done
          cp ../scripts/install.sh ../scripts/install.ps1 .
          sha256sum *.tar.gz *.zip install.sh install.ps1 > "iroh-toolbox-$RELEASE_TAG-sha256sums.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/*.zip dist/install.sh dist/install.ps1 \
            "dist/iroh-toolbox-$RELEASE_TAG-sha256sums.txt"
