name: Documentation

on:
  # A push to main that changes what the site renders publishes it.
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - CHANGELOG.md        # included by docs/maintainers/changelog.md
      - CONTRIBUTING.md     # included by docs/maintainers/contributing.md
      - LICENSE.txt         # included by docs/reference/license.md
      - mise.toml           # uv version
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (main branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  # Never interrupt a Pages deployment halfway.
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read uv version
        id: tools
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("uv=" + tomllib.loads(Path("mise.toml").read_text())["tools"]["uv"])
          PY
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.tools.outputs.uv }}
      - run: uvx --with-requirements docs/requirements.txt zensical build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !env.ACT }}
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Store documentation with act
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: (github.event_name == 'push' || inputs.deploy) && github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    name: Publish documentation
    if: (github.event_name == 'push' || inputs.deploy) && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
