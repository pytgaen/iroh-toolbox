<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">iroh-toolbox — Send folders. Chat. Reach services.</title>
  <desc id="desc">A native command-line toolkit for iroh: diagnose relay access and connection paths, transfer files, chat with a peer, exchange binary streams and forward TCP services.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#102b34"/><stop offset="1" stop-color="#07181f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#67e8c6" stop-opacity=".08"/><stop offset="1" stop-color="#67e8c6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b4dad3" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#background)"/>
  <rect width="1200" height="540" rx="24" fill="url(#grid)"/>
  <ellipse cx="920" cy="270" rx="360" ry="300" fill="url(#glow)"/>
  <svg xmlns="http://www.w3.org/2000/svg" x="56" y="44" width="76" height="76" viewBox="0 0 744 744" role="img" aria-labelledby="mark-title mark-desc">
    <title id="mark-title">iroh-toolbox</title>
    <desc id="mark-desc">Two interlocking routes, one mint and one amber, surround a closed ivory lock.</desc>
    <defs>
      <linearGradient id="mark-background" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#102b34"/>
        <stop offset="1" stop-color="#0b252e"/>
      </linearGradient>
      <linearGradient id="mark-mint" x1="0" y1="1" x2="1" y2="0">
        <stop stop-color="#56ddc0"/>
        <stop offset="1" stop-color="#76efd1"/>
      </linearGradient>
      <linearGradient id="mark-amber" x1="0" y1="1" x2="1" y2="0">
        <stop stop-color="#f8c870"/>
        <stop offset="1" stop-color="#ffd777"/>
      </linearGradient>
    </defs>
    <rect width="744" height="744" rx="152" fill="url(#mark-background)"/>
    <g transform="translate(-255 -98)">
      <path fill="url(#mark-mint)" d="M543 195C558 187 575 187 590 196L674 242C691 251 689 271 674 280L610 315C599 321 591 319 581 314L574 310C568 306 562 305 555 309L451 368C439 374 433 385 433 399V507C433 522 437 532 450 539L522 578C531 583 539 579 548 574L718 513V550C718 563 708 574 693 584L571 656C554 674 539 677 521 668L366 584C342 571 330 554 330 529V352C330 326 343 310 366 297Z"/>
      <path fill="url(#mark-amber)" d="M720 275C735 266 750 267 768 277L893 345C913 357 924 378 924 400V592C924 617 913 637 891 650L733 743C715 755 697 755 679 745L589 695C570 684 571 666 589 655L649 623C659 617 668 622 677 627L686 632C693 637 701 637 709 632L809 577C821 570 821 559 821 543V433C821 416 817 408 806 402L737 372C729 367 722 369 715 373L537 471V417C537 391 549 374 570 362Z"/>
      <path fill="#f1faf8" d="M601 482V468C601 452 613 440 629 440S657 452 657 468V482H644V468C644 459 638 453 629 453S614 459 614 468V482Z"/>
      <rect x="590" y="480" width="78" height="56" rx="8" fill="#f1faf8"/>
    </g>
  </svg>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="150" y="94" font-size="36" font-weight="800" letter-spacing="-.8" fill="#f1faf8">iroh-toolbox</text>
    <text x="56" y="200" font-size="54" font-weight="800" letter-spacing="-1.8" fill="#f1faf8">Send folders.</text>
    <text x="56" y="263" font-size="54" font-weight="800" letter-spacing="-1.8" fill="#67e8c6">Reach services.</text>
    <text x="58" y="310" font-size="19" fill="#bdd0d2">Share a code. Chat. Control your relay.</text>
    <text x="58" y="339" font-size="19" fill="#bdd0d2">One native CLI for developers and admins.</text>

    <rect x="56" y="378" width="108" height="34" rx="17" fill="#153d39" stroke="#306a5d"/>
    <text x="110" y="400" text-anchor="middle" font-size="12" font-weight="700" letter-spacing=".4" fill="#91eed3">NATIVE CLI</text>
    <rect x="178" y="378" width="242" height="34" rx="17" fill="#182f38" stroke="#36515a"/>
    <text x="299" y="400" text-anchor="middle" font-size="12" font-weight="700" letter-spacing=".4" fill="#d2dfe3">LINUX · WINDOWS</text>

    <rect x="56" y="446" width="520" height="48" rx="12" fill="#0a1e26" stroke="#2d4a53"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="18">
      <text x="76" y="476" fill="#67e8c6">$</text>
      <text x="101" y="476" fill="#dcece9">iroh-toolbox send ./photos</text>
      <path d="M466 460v19" stroke="#f8c870" stroke-width="2"/>
    </g>

    <text x="652" y="67" font-size="13" font-weight="700" letter-spacing="2" fill="#9ab9bf">TOOLS FOR PEER-TO-PEER WORK</text>

    <rect x="652" y="94" width="238" height="188" rx="18" fill="#122f37" stroke="#315a61"/>
    <rect x="906" y="94" width="238" height="188" rx="18" fill="#29372e" stroke="#665d43"/>
    <rect x="652" y="302" width="238" height="188" rx="18" fill="#122f37" stroke="#315a61"/>
    <rect x="906" y="302" width="238" height="188" rx="18" fill="#29372e" stroke="#665d43"/>

    <!-- Left column: files and chat, tunnels (icons drawn for the right column). -->
    <g fill="none" stroke="#67e8c6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-254 0)">
      <path d="M931 125h12l5 5h20v25h-37Z"/>
      <path d="M942 140h13m-5-5 5 5-5 5"/>
      <path d="M932 356v-18a17 17 0 0 1 34 0v18M939 354v-16a10 10 0 0 1 20 0v16M925 356h13m22 0h13"/>
    </g>
    <!-- Right column: streams, diagnostics (icons drawn for the left column). -->
    <g fill="none" stroke="#f8c870" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(254 -208)" d="M676 329h29m-7-7 7 7-7 7M714 349h-29m7-7-7 7 7 7"/>
      <g transform="translate(254 208)">
        <rect x="676" y="120" width="38" height="34" rx="5"/>
        <path d="M679 138h7l4-8 6 16 5-8h10"/>
      </g>
    </g>

    <text x="676" y="205" font-size="26" font-weight="700" fill="#f1faf8">Files &amp; chat</text>
    <text x="930" y="205" font-size="26" font-weight="700" fill="#f1faf8">Streams</text>
    <text x="676" y="413" font-size="26" font-weight="700" fill="#f1faf8">Tunnels</text>
    <text x="930" y="413" font-size="26" font-weight="700" fill="#f1faf8">Diagnostics</text>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
      <text x="676" y="245" font-size="13" fill="#9de9d5">send · receive · chat</text>
      <text x="930" y="245" fill="#f5d28f">pipe</text>
      <text x="676" y="453" fill="#9de9d5">tunnel tcp</text>
      <text x="930" y="453" fill="#f5d28f">relay · ping · bench</text>
    </g>
  </g>
</svg>
