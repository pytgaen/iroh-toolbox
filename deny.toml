[advisories]
ignore = [
  # Informational: no known flaw and no patched version. chrono shows chat
  # times and dates; replace it (jiff) with the iroh 1.5 update.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known flaw; replacement planned with iroh 1.5" },
]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
